<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <h2>Socket.IO WebSocket Client</h2>
    <button onclick="connectSocket()">Connect & Join Lobby</button>

    <pre id="output"></pre>

    <script>
      let socket;

      function connectSocket() {
        const playerId = prompt("Enter your Player ID (UUID)");

        socket = io("http://localhost:3000", {
          transports: ["websocket"],
        });

        socket.on("connect", () => {
          log("✅ Connected to Socket.IO server");

          socket.emit("joinLobby", { playerId });
          log(`📤 Sent joinLobby for playerId: ${playerId}`);
        });

        socket.on("startRound", (data) => {
          log("🎯 startRound event received:");
          log(JSON.stringify(data, null, 2));
        });

        socket.on("disconnect", () => {
          log("🔌 Disconnected from server");
        });
      }

      function log(message) {
        document.getElementById("output").textContent += message + "\n";
      }
    </script>
  </body>
</html>
